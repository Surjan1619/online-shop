<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>ELITE · Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --bg-gradient-start: #f0f4fe;
            --bg-gradient-end: #e9eefa;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
            --card-bg: rgba(255, 255, 255, 0.8);
            --primary: #3a56d8;
            --primary-light: #4361ee;
            --primary-deep: #2a41b0;
            --accent: #7b4ee3;
            --text-heading: #131836;
            --text-body: #2b3148;
            --text-muted: #5e657b;
            --border-light: rgba(0, 0, 0, 0.06);
            --shadow-sm: 0 15px 30px -12px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 24px 44px -16px rgba(26, 47, 105, 0.18);
            --radius-md: 16px;
            --radius-lg: 28px;
            --transition-spring: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
            background: radial-gradient(circle at 20% 30%, #e2eafc, #d9e2f2 90%);
            background-attachment: fixed;
            color: var(--text-body);
            min-height: 100vh;
        }

        .top-bar {
            position: sticky;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 8%;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            z-index: 100;
            box-shadow: 0 6px 20px -10px rgba(0, 0, 0, 0.02);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(145deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            cursor: pointer;
            transition: var(--transition-spring);
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .logo i {
            font-size: 1.5rem;
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            gap: 12px;
        }

        .nav-link {
            padding: 10px 20px;
            border-radius: 40px;
            border: 1px solid rgba(67, 97, 238, 0.08);
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(6px);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-heading);
            transition: var(--transition-spring);
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .nav-link i {
            color: var(--primary);
        }

        .nav-link:hover {
            background: white;
            border-color: var(--primary-light);
            box-shadow: 0 10px 20px -10px rgba(67, 97, 238, 0.2);
            transform: translateY(-2px);
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #dc2626;
        }

        .btn-logout i {
            color: #dc2626;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.15);
            border-color: #dc2626;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px 8%;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition-spring);
            animation: fadeSlideUp 0.6s ease;
        }

        .glass-card:hover {
            box-shadow: var(--shadow-hover);
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(255, 255, 255, 0.8);
        }

        @keyframes fadeSlideUp {
            0% {
                opacity: 0;
                transform: translateY(24px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .page-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-heading);
            letter-spacing: -0.02em;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-title i {
            color: var(--primary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(145deg, var(--primary), var(--accent));
            color: white;
            padding: 24px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 16px 28px -10px rgba(67, 97, 238, 0.4);
            transition: var(--transition-spring);
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 24px 38px -10px rgba(67, 97, 238, 0.5);
        }

        .stat-card h3 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .stat-card p {
            opacity: 0.9;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-heading);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: var(--primary);
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 20px;
            box-shadow: var(--shadow-sm);
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: transparent;
            min-width: 500px;
        }

        th {
            background: rgba(67, 97, 238, 0.08);
            color: var(--text-heading);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            padding: 18px 16px;
            text-align: left;
            border-bottom: 2px solid rgba(67, 97, 238, 0.1);
        }

        td {
            padding: 16px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            color: var(--text-body);
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.5);
        }

        .badge-id {
            background: rgba(67, 97, 238, 0.12);
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
        }

        .username-cell {
            font-weight: 600;
            color: var(--text-heading);
            cursor: pointer;
            transition: var(--transition-spring);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .username-cell:hover {
            color: var(--primary);
            transform: translateX(4px);
        }

        .username-cell i {
            color: var(--primary-light);
            opacity: 0;
            transition: var(--transition-spring);
        }

        .username-cell:hover i {
            opacity: 1;
        }

        .delete-cell {
            font-weight: 600;
            color: #dc2626;
            cursor: pointer;
            transition: var(--transition-spring);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 12px;
            background: rgba(239, 68, 68, 0.1);
        }

        .delete-cell:hover {
            background: rgba(239, 68, 68, 0.2);
            transform: translateX(4px);
        }

        .delete-cell i {
            color: #dc2626;
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-page {
            background: linear-gradient(145deg, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-spring);
            box-shadow: 0 12px 24px -8px rgba(67, 97, 238, 0.4);
        }

        .btn-page:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 16px 28px -8px rgba(67, 97, 238, 0.5);
        }

        .btn-page:disabled {
            background: #cbd5e0;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .page-info {
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: 600;
            background: rgba(255, 255, 255, 0.7);
            padding: 10px 20px;
            border-radius: 30px;
        }

        .alert {
            padding: 16px 24px;
            border-radius: 16px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease;
            font-weight: 500;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.12);
            border-left: 4px solid #dc2626;
            color: #991b1b;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.12);
            border-left: 4px solid #10b981;
            color: #065f46;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            border: 1px dashed rgba(67, 97, 238, 0.3);
        }

        .empty-state i {
            font-size: 3rem;
            color: var(--primary-light);
            opacity: 0.7;
            margin-bottom: 16px;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
        }

        .spinner {
            border: 3px solid rgba(67, 97, 238, 0.2);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            .top-bar {
                padding: 10px 5%;
            }

            .container {
                padding: 20px 5%;
            }

            .page-title {
                font-size: 1.5rem;
            }

            .stat-card h3 {
                font-size: 2rem;
            }

            .pagination {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="/main_page" class="logo">
        <i class="fas fa-cube"></i> ELITE
    </a>
    <div class="nav-links">
        <a href="/main_page" class="nav-link"><i class="fas fa-store"></i> Home</a>
        <button class="nav-link btn-logout" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> Logout
        </button>
    </div>
</div>

<div class="container">
    <div class="glass-card">
        <h1 class="page-title">
            <i class="fas fa-cogs"></i> Admin Panel
        </h1>

        <div id="alertContainer"></div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3 id="usersCount">-</h3>
                <p>Users</p>
            </div>
            <div class="stat-card">
                <h3 id="productsCount">-</h3>
                <p>Products</p>
            </div>
            <div class="stat-card">
                <h3 id="productsTotalCount">-</h3>
                <p>Total Products</p>
            </div>
        </div>

        <h2 class="section-title">
            <i class="fas fa-users"></i> Users
        </h2>

        <div id="usersContainer">
            <div class="loading" id="loadingUsers">
                <div class="spinner"></div>
                Loading users...
            </div>
        </div>

        <div class="pagination" id="usersPagination" style="display: none;">
            <button class="btn-page" id="prevUsers" disabled>← Previous</button>
            <span class="page-info" id="usersPageInfo">Page 1</span>
            <button class="btn-page" id="nextUsers">Next →</button>
        </div>
    </div>
</div>

<script>
    const API_BASE = '';
    const TOKEN_KEY = 'access_token';

    let usersOffset = 0;
    const USERS_LIMIT = 20;
    let usersHasMore = true;
    let isLoading = false;

    const alertContainer = document.getElementById('alertContainer');

    function getToken() {
        return localStorage.getItem(TOKEN_KEY);
    }

    function logout() {
        localStorage.removeItem(TOKEN_KEY);
        window.location.href = '/login';
    }

    function redirectToLogin() {
        showAlert('Your session has expired. Please log in again.', 'error');
        setTimeout(() => {
            window.location.href = '/login';
        }, 2000);
    }

    function showAlert(message, type = 'error') {
        const icons = {
            error: '<i class="fas fa-times-circle"></i>',
            success: '<i class="fas fa-check-circle"></i>'
        };
        alertContainer.innerHTML = `
            <div class="alert alert-${type}">
                ${icons[type] || icons.error}
                <span>${message}</span>
            </div>
        `;
        setTimeout(() => {
            alertContainer.innerHTML = '';
        }, 5000);
    }

    function escapeHtml(unsafe) {
        return unsafe.replace(/[&<>"']/g, function (m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            if (m === '"') return '&quot;';
            if (m === "'") return '&#039;';
            return m;
        });
    }

    async function loadStats() {
        const token = getToken();
        if (!token) {
            redirectToLogin();
            return;
        }

        try {
            const usersRes = await fetch(`${API_BASE}/get-users?offset=0`, {
                headers: {'Authorization': `Bearer ${token}`}
            });

            if (usersRes.status === 401) {
                redirectToLogin();
                return;
            }

            const usersData = await usersRes.json();
            const users = usersData.userlist || [];
            document.getElementById('usersCount').textContent = users.length;

            const productsRes = await fetch(`${API_BASE}/get-products`, {
                headers: {'Authorization': `Bearer ${token}`}
            });

            if (productsRes.ok) {
                const productsData = await productsRes.json();
                const products = productsData.products || [];
                document.getElementById('productsCount').textContent = products.length;
                document.getElementById('productsTotalCount').textContent = products.length;
            }
        } catch (error) {
            console.error('Error loading stats:', error);
        }
    }

    async function loadUsers(offset = 0) {
        const token = getToken();
        if (!token) {
            redirectToLogin();
            return;
        }

        isLoading = true;
        const loadingEl = document.getElementById('loadingUsers');
        const container = document.getElementById('usersContainer');
        loadingEl.style.display = 'block';
        container.innerHTML = '';
        container.appendChild(loadingEl);

        try {
            const response = await fetch(`${API_BASE}/get-users?offset=${offset}`, {
                headers: {'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json'}
            });

            if (response.status === 401) {
                redirectToLogin();
                return;
            }

            const data = await response.json();
            const users = data.userlist || [];
            renderUsers(users, offset);
        } catch (error) {
            console.error('Error loading users:', error);
            showAlert('Failed to load users', 'error');
            container.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i>Failed to load users</div>';
        } finally {
            isLoading = false;
            loadingEl.style.display = 'none';
        }
    }

    function renderUsers(users, offset) {
        const container = document.getElementById('usersContainer');
        const pagination = document.getElementById('usersPagination');

        if (!users || users.length === 0) {
            container.innerHTML = '<div class="empty-state"><i class="fas fa-users"></i><br>No users found</div>';
            pagination.style.display = 'none';
            return;
        }

        container.innerHTML = `
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${users.map(user => `
                            <tr data-user-id="${user.id}">
                                <td><span class="badge-id">#${user.id}</span></td>
                                <td>
                                    <span class="username-cell" onclick="goToProfile(${user.id})">
                                        ${escapeHtml(user.username)}
                                        <i class="fas fa-arrow-right"></i>
                                    </span>
                                </td>
                                <td>
                                    <span class="delete-cell" onclick="deleteUser(${user.id})">
                                        <i class="fas fa-trash"></i> Delete
                                    </span>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;

        usersHasMore = users.length === USERS_LIMIT;
        usersOffset = offset;
        pagination.style.display = 'flex';
        document.getElementById('prevUsers').disabled = offset === 0;
        document.getElementById('nextUsers').disabled = !usersHasMore;
        document.getElementById('usersPageInfo').textContent = `Page ${Math.floor(offset / USERS_LIMIT) + 1}`;
    }

    function goToProfile(userId) {
        window.location.href = `/go-to-profile/${userId}`;
    }

    async function deleteUser(userId) {
        if (!confirm(`Are you sure you want to delete user #${userId}?`)) return;

        const token = getToken();
        if (!token) {
            redirectToLogin();
            return;
        }

        try {
            const response = await fetch(`${API_BASE}/delete-user/?user_id=${userId}`, {
                method: 'DELETE',
                headers: {'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json'}
            });

            if (response.status === 401) {
                redirectToLogin();
                return;
            }

            if (!response.ok) throw new Error('Failed to delete');

            showAlert(`User #${userId} deleted successfully`, 'success');
            loadUsers(usersOffset);
            loadStats();
        } catch (error) {
            console.error('Delete error:', error);
            showAlert('Error deleting user', 'error');
        }
    }

    document.getElementById('prevUsers').addEventListener('click', () => {
        if (!isLoading && usersOffset >= USERS_LIMIT) {
            loadUsers(usersOffset - USERS_LIMIT);
        }
    });

    document.getElementById('nextUsers').addEventListener('click', () => {
        if (!isLoading && usersHasMore) {
            loadUsers(usersOffset + USERS_LIMIT);
        }
    });

    document.addEventListener('DOMContentLoaded', async () => {
        const token = getToken();
        if (!token) {
            showAlert('No token found. Please log in.', 'error');
            setTimeout(() => {
                window.location.href = '/login';
            }, 2000);
            return;
        }

        try {
            const checkRes = await fetch(`${API_BASE}/get-users?offset=0`, {
                headers: {'Authorization': `Bearer ${token}`}
            });
            if (checkRes.status === 401) {
                showAlert('Access denied. Admin only.', 'error');
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);
                return;
            }
        } catch (e) {
            showAlert('Error verifying access.', 'error');
            setTimeout(() => {
                window.location.href = '/login';
            }, 2000);
            return;
        }

        loadStats();
        loadUsers(0);
    });
</script>

</body>
</html>
